<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>识字泡泡</title>

            background: #1a5a7a;

            align-items: center;
            height: 100vh;

        #gameContainer {

            width: 100vw;
            height: 100vh;
            cursor: pointer;
            touch-action: none;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4a9aba, #2a7a9a);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            overflow-y: auto;
            touch-action: pan-y;
            gap: 8px;
            box-shadow: inset 0 0 100px rgba(255,255,255,0.1);
        }
        #overlay h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            text-shadow: 0 0 40px rgba(255,255,255,0.3), 0 0 80px rgba(0,180,255,0.3);
            margin-bottom: 2px;
            color: #fff;
        }
        #overlay .sub {
            font-size: clamp(1.2rem, 3vw, 2rem);
            opacity: 0.9;
            margin-bottom: 4px;
            color: #f0f8ff;
        }
        .section-title {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            opacity: 0.9;
            margin: 4px 0 2px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            color: #f0f8ff;
        }
        .section-title button {
            font-size: clamp(0.8rem, 1.8vw, 1.2rem);
            padding: 4px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .section-title button:hover { background: rgba(255,255,255,0.3); }
        .word-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 95vw;
            padding: 4px 0;
        }
        .word-tag {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            padding: 4px 16px;
            border-radius: 40px;
            background: rgba(255,255,255,0.15);
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
            color: #fff;
            backdrop-filter: blur(2px);
        }
        .word-tag.active {
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.25);
        }
        .word-tag.review {
            border-color: #ffcc66;
            background: rgba(255,204,102,0.2);
        }
        .word-tag:hover { background: rgba(255,255,255,0.3); }
        .emoji-preview {
            position: fixed;
            display: none;
            z-index: 30;
            pointer-events: none;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.95);
            color: #1a3a4a;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            font-size: clamp(1.2rem, 3vw, 2rem);
            line-height: 1;
            transform: translate(-50%, -110%);
            white-space: nowrap;
        }
        #reviewArea {
            display: none;
            min-height: 40px;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 6px;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        #reviewArea .word-grid { min-height: 34px; }
        #reviewEmpty {
            opacity: 0.6;
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            color: #e0f0ff;
        }
        #speedControls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(255,255,255,0.12);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .speed-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: #f0f8ff;
        }
        .speed-item input[type="range"] {
            width: clamp(70px, 10vw, 120px);
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .speed-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffcc66;
            cursor: pointer;
        }
        .speed-item input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffcc66;
            cursor: pointer;
            border: none;
        }
        .speed-value {
            min-width: 28px;
            text-align: center;
            font-weight: bold;
            color: #ffcc66;
            font-size: clamp(0.9rem, 2vw, 1.3rem);
        }
        #intervalSection {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            flex-wrap: wrap;
            justify-content: center;
            color: #f0f8ff;
        }
        #intervalSelect {
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            padding: 2px 12px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            outline: none;
        }
        #intervalSelect option { background: #1a5a7a; color: #fff; }
        #startBtn {
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            padding: 12px 44px;
            border: none;
            border-radius: 60px;
            background: #ffcc66;
            color: #1a3a4a;
            font-weight: bold;
            box-shadow: 0 0 40px rgba(255,204,102,0.4);
            cursor: pointer;
            transition: 0.2s;
            margin: 4px 0;
        }
        #startBtn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,204,102,0.6); }

        #testRewardBtn {

            right: 24px;
            top: 200px;
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;

            color: #ffffff;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.18);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin: 0;
        }
        #testRewardBtn:hover { transform: scale(1.1); background: rgba(255,255,255,0.26); }
        #hint {
            font-size: clamp(0.6rem, 1.2vw, 0.9rem);
            opacity: 0;
            height: 18px;
            pointer-events: none;
            color: #fff;
        }
        #backHint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.25);
            font-size: clamp(0.5rem, 1vw, 0.8rem);
            pointer-events: none;
            z-index: 5;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 20;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-content {
            background: rgba(30,80,100,0.95);
            padding: 30px 40px;
            border-radius: 30px;
            max-width: 80vw;
            max-height: 70vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
        }
        .modal-content h2 {
            margin-bottom: 15px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }
        .modal-content .word-grid { gap: 12px; }
        .modal-content .word-tag {
            font-size: clamp(1.2rem, 3vw, 2rem);
            padding: 6px 20px;
        }
        .modal-close {
            margin-top: 20px;
            padding: 8px 30px;
            border-radius: 40px;
            border: none;
            background: #ffcc66;
            color: #1a3a4a;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            #overlay h1 { font-size: 2.5rem; }
            .word-tag { font-size: 1rem; padding: 3px 10px; }
            #speedControls { gap: 12px; padding: 4px 10px; }
            .modal-content { padding: 20px; max-width: 95vw; }
        }
    </style>
</head>

<div id="overlay">
    <h1>🏎️ 识字泡泡</h1>

    <div class="section-title">
        <span>📚 新字词</span>
        <button id="reviewBtn">📖 复习</button>
    </div>
    <div id="mainGrid" class="word-grid"></div>

    <div id="reviewArea">
        <div class="section-title"><span>🔁 复习集</span></div>
        <div id="reviewGrid" class="word-grid"><span id="reviewEmpty">（空）</span></div>
    </div>

    <div id="speedControls">
        <div class="speed-item">
            <label>🫧 泡泡</label>
            <input type="range" id="bubbleSpeedSlider" min="1" max="10" step="1" value="4">
            <span class="speed-value" id="bubbleSpeedDisplay">4</span>
        </div>
        <div class="speed-item">
            <label>🏎️ 奖励</label>
            <input type="range" id="creatureSpeedSlider" min="1" max="10" step="1" value="4">
            <span class="speed-value" id="creatureSpeedDisplay">4</span>
        </div>
    </div>

    <div id="intervalSection">
        <label>🎁 每答对</label>
        <select id="intervalSelect">
            <option value="5">5</option><option value="10" selected>10</option>
            <option value="15">15</option><option value="20">20</option>
            <option value="25">25</option><option value="30">30</option><option value="50">50</option>
        </select>
        <label>次出奖励</label>
    </div>

    <button id="startBtn">开始游戏</button>
    <button id="testRewardBtn" type="button" aria-label="测试奖励">🫧</button>
</div>

<div class="modal" id="reviewModal">
    <div class="modal-content">
        <h2>📖 复习字词</h2>
        <div id="reviewModalGrid" class="word-grid"></div>
        <button class="modal-close" id="modalCloseBtn">关闭</button>
    </div>
</div>

<div id="gameContainer"></div>
<div id="backHint">双击返回选字页面</div>

    let nextBubbleMode = null;
    let gameRunning = false;

    function clampSpeedValue(value, fallback) {
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) return fallback;
        return Math.min(10, Math.max(1, Math.round(parsed)));
    }

    function initializeWords() {
        const newWords = Array.isArray(WORD_CONFIG.new_words) ? WORD_CONFIG.new_words : [];
        const reviewWords = Array.isArray(WORD_CONFIG.review_words) ? WORD_CONFIG.review_words : [];

        bubbleSpeedMul = clampSpeedValue(WORD_CONFIG.config.bubbleSpeed, 4);
        creatureSpeedMul = clampSpeedValue(WORD_CONFIG.config.creatureSpeed, 4);
        bubbleSpeedSlider.value = String(bubbleSpeedMul);
        bubbleSpeedDisplay.textContent = String(bubbleSpeedMul);
        creatureSpeedSlider.value = String(creatureSpeedMul);
        creatureSpeedDisplay.textContent = String(creatureSpeedMul);

        ALL_WORDS = newWords.map(item => item.text);
        activeChars = newWords.filter(item => item.selected === true).map(item => item.text);
        reviewChars = reviewWords.map(item => String(item));
    }

    function showEmojiPreview(target, word) {
        const emoji = WORD_CONFIG.emoji_dict?.[word];
        if (!emoji) {
            emojiPreview.style.display = 'none';
            return;
        }
        const rect = target.getBoundingClientRect();
        emojiPreview.textContent = emoji;
        emojiPreview.style.left = `${rect.left + rect.width / 2}px`;
        emojiPreview.style.top = `${rect.top}px`;
        emojiPreview.style.display = 'inline-flex';
    }

    function hideEmojiPreview() {
        emojiPreview.style.display = 'none';
    }

    function bindWordTagPreview(tag, word) {
        const emoji = WORD_CONFIG.emoji_dict?.[word];
        if (!emoji) return;
        tag.addEventListener('mouseenter', () => showEmojiPreview(tag, word));
        tag.addEventListener('mousemove', () => showEmojiPreview(tag, word));
        tag.addEventListener('mouseleave', hideEmojiPreview);
    }

    function renderWords() {
        mainGrid.innerHTML = '';
        ALL_WORDS.forEach(w => {
            const tag = document.createElement('span');
            tag.className = 'word-tag' + (activeChars.includes(w) ? ' active' : '');
            tag.textContent = w;
            bindWordTagPreview(tag, w);
            tag.addEventListener('click', (e) => {
                e.stopPropagation();
                if (activeChars.includes(w)) {
                    activeChars = activeChars.filter(c => c !== w);
                } else {
                    activeChars.push(w);
                }
                renderWords();
            });
            tag.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (reviewChars.includes(w)) {
                    reviewChars = reviewChars.filter(c => c !== w);
                } else {
                    reviewChars.push(w);
                }
                if (!activeChars.includes(w)) activeChars.push(w);
                renderWords();
            });
            mainGrid.appendChild(tag);
        });

        reviewGrid.innerHTML = '';
        if (reviewChars.length === 0) {
            reviewGrid.innerHTML = '<span id="reviewEmpty">（空）</span>';
        } else {
            reviewChars.forEach(w => {
                const tag = document.createElement('span');
                tag.className = 'word-tag review';
                tag.textContent = w;
                bindWordTagPreview(tag, w);
                tag.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    reviewChars = reviewChars.filter(c => c !== w);
                    renderWords();
                });
                reviewGrid.appendChild(tag);
            });
        }
    }

    // ---- 绘制背景 ----
    function drawBackground() {
        bgLayer.removeChildren();
        const bg = new PIXI.Graphics();
        bg.beginFill(0x1a6a8a);
        bg.drawRect(0, 0, W, H);
        bg.endFill();
        bgLayer.addChild(bg);

        const time = Date.now() / 2000;
        for (let i = 0; i < 4; i++) {
            const y = (H * 0.3) + i * 90 + Math.sin(time + i * 1.2) * 15;
            const g = new PIXI.Graphics();
            g.beginFill(0xffffff, 0.07);
            g.drawEllipse(W / 2 + Math.sin(time * 0.7 + i * 2) * 60, y, W * 0.45, 12);
            g.endFill();
            bgLayer.addChild(g);
        }

        const sand = new PIXI.Graphics();
        sand.beginFill(0x6a8a6a);
        sand.drawRect(0, H - 30, W, 30);
        sand.endFill();
        bgLayer.addChild(sand);

        for (let i = 0; i < 12; i++) {
            const x = i * 80 + Math.sin(i * 0.7) * 10;
            const g = new PIXI.Graphics();
            g.beginFill(0x7a9a7a);
            g.arc(x, H - 14 + Math.sin(i * 0.5) * 3, 15, 0, Math.PI, true);
            g.closePath();
            g.endFill();
            bgLayer.addChild(g);
        }

        const time2 = Date.now() / 1800;
        for (let i = 0; i < 8; i++) {
            const baseX = 50 + i * 100 + Math.sin(i * 1.2) * 12;
            const baseY = H - 16;
            const g = new PIXI.Graphics();
            g.lineStyle(4, 0x4a9a5a);
            g.moveTo(baseX, baseY);
            for (let t = 0; t < 12; t++) {
                const y = baseY - t * 5;
                const x = baseX + Math.sin(t * 0.35 + time2 + i * 0.8) * (5 + t * 0.35);
                g.lineTo(x, y);
            }
            bgLayer.addChild(g);
        }

        for (let i = 0; i < 10; i++) {
            const baseX = 30 + i * 90 + Math.sin(i * 1.0 + time2 * 0.88) * 10;
            const baseY = H - 28;
            const waviness = 1 + Math.sin(time2 * 0.4 + i * 0.7) * 0.7;
            const g = new PIXI.Graphics();
            g.lineStyle(5, 0x2a8a5b, 0.9);
            g.moveTo(baseX, baseY);
            for (let t = 0; t < 16; t++) {
                const y = baseY - t * 7;
                const sway = Math.sin(t * 0.18 + time2 * (0.8 + i * 0.02)) * (8 + t * 0.35) * waviness;
                const x = baseX + sway;
                g.lineTo(x, y);
            }
            bgLayer.addChild(g);
        }
    }

    // ---- 工具：绘制泡泡 Sprite ----
    function createBubbleSprite(charVal, x, y, radius, isMain) {
        const container = new PIXI.Container();
        container.x = x;
        container.y = y;

        const g = new PIXI.Graphics();
        g.lineStyle(2, 0xffffff, isMain ? 0.3 : 0.18);
        g.beginFill(0xffffff, 0.08);
        g.drawCircle(0, 0, radius);
        g.endFill();
        container.addChild(g);

        const text = new PIXI.Text(charVal, {
            fontSize: radius * 1.2,
            fill: isMain ? '#ffffff' : 'rgba(255,255,255,0.72)',

            fontWeight: '500',
            fontStyle: 'normal',
            align: 'center',
            dropShadow: true,
            dropShadowColor: '#0f2f42',
            dropShadowAlpha: 0.45,
            dropShadowBlur: 6,
            dropShadowDistance: 1,
        });
        text.anchor.set(0.5);
        container.addChild(text);


        return container;
    }

    // ---- 泡泡 ----
    function createBubble(mode = null) {
        let pool = [];
        const m = activeChars.length;
        const n = reviewChars.length;
        if (m > 0 && n > 0) {
            const reviewProbability = (n / 10) / (m + n / 10);
            pool = Math.random() < reviewProbability ? reviewChars.slice() : activeChars.slice();
        } else if (n > 0) {
            pool = reviewChars.slice();
        } else {
            pool = activeChars.slice();
        }
        if (pool.length === 0) return null;

        let available = pool.filter(c => c !== lastChar);
        if (available.length === 0) available = pool.slice();
        const charVal = available[Math.floor(Math.random() * available.length)];
        lastChar = charVal;

        const radius = Math.min(W, H) * 0.18;
        const x = W / 2 + (Math.random() - 0.5) * 180;
        const y = H + radius + 20;
        const baseSpeed = (240 + Math.random() * 80) * (bubbleSpeedMul / 6);
        const sprite = createBubbleSprite(charVal, x, y, radius, true);
        bubbleLayer.addChild(sprite);

        const bubbleMode = mode || nextBubbleMode || 'normal';
        nextBubbleMode = null;

        const bubbleObj = {
            char: charVal,
            sprite: sprite,
            x: x,
            y: y,
            radius: radius,
            speed: Math.max(140, baseSpeed),
            angle: 0,
            wobbleSpeed: 0.01 + Math.random() * 0.02,
            wobbleAmplitude: 2.5 + Math.random() * 1.6,
            alive: true,
            bursting: false,
            matched: false,
            topTimer: 0,
            mode: bubbleMode,
        };

        if (bubbleMode === 'mischief') {
            const edge = Math.floor(Math.random() * 4);
            const speed = 14 + Math.random() * 4;
            if (edge === 0) {
                bubbleObj.x = bubbleObj.radius + 6;
                bubbleObj.y = bubbleObj.radius + Math.random() * (H - bubbleObj.radius * 2);
                bubbleObj.vx = speed;
                bubbleObj.vy = (Math.random() * 2 - 1) * (speed * 0.6);
            } else if (edge === 1) {
                bubbleObj.x = W - bubbleObj.radius - 6;
                bubbleObj.y = bubbleObj.radius + Math.random() * (H - bubbleObj.radius * 2);
                bubbleObj.vx = -speed;
                bubbleObj.vy = (Math.random() * 2 - 1) * (speed * 0.6);
            } else if (edge === 2) {
                bubbleObj.x = bubbleObj.radius + Math.random() * (W - bubbleObj.radius * 2);
                bubbleObj.y = bubbleObj.radius + 6;
                bubbleObj.vx = (Math.random() * 2 - 1) * (speed * 0.6);
                bubbleObj.vy = speed;
            } else {
                bubbleObj.x = bubbleObj.radius + Math.random() * (W - bubbleObj.radius * 2);
                bubbleObj.y = H - bubbleObj.radius - 6;
                bubbleObj.vx = (Math.random() * 2 - 1) * (speed * 0.6);
                bubbleObj.vy = -speed;
            }
            sprite.x = bubbleObj.x;
            sprite.y = bubbleObj.y;
            bubbleObj.phase = 'bounce';
            bubbleObj.phaseTimer = 0;
            bubbleObj.bounceDuration = 3;
            bubbleObj.spiralDuration = 3;
            bubbleObj.spiralTimer = 0;
            bubbleObj.spiralAngle = 0;
            bubbleObj.initialSpiralRadius = 0;
            bubbleObj.spiralThetaStart = 0;
            bubbleObj.spiralOmega = (Math.PI * 2.2 + Math.random() * Math.PI * 0.8) / 60;
            bubbleObj.spiralDecay = 0;
        }

        return bubbleObj;
    }

    // ---- 粒子 ----
    function spawnParticles(x, y, color, count) {
        count = count || 55;
        const colors = [0xff6b6b, 0xffd93d, 0x6bcb77, 0x4d96ff, 0xff6bff, 0xffaa33, 0xff4757, 0x2ed573];
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 3 + Math.random() * 6;
            const size = 3 + Math.random() * 7;
            const c = color || colors[Math.floor(Math.random() * colors.length)];
            const p = new PIXI.Graphics();
            p.beginFill(c);
            p.drawCircle(0, 0, size);
            p.endFill();
            p.x = x + (Math.random() - 0.5) * 14;
            p.y = y + (Math.random() - 0.5) * 14;
            p.alpha = 1;
            particleLayer.addChild(p);
            const spread = 0.9 + Math.random() * 0.3;
            particles.push({
                sprite: p,
                x: p.x,
                y: p.y,
                vx: Math.cos(angle) * speed * spread,
                vy: Math.sin(angle) * speed * spread,
                life: 1.2 + Math.random() * 0.4,
                decay: 0.012 + Math.random() * 0.02,
                gravity: 0.04,
                friction: 0.96 + Math.random() * 0.02,
            });
        }
    }

    // ---- 破裂 emoji 特效 ----
    function spawnEmojiEffect(charVal, x, y, size, onComplete) {
        const emoji = WORD_CONFIG.emoji_dict?.[charVal];
        if (!emoji) {
            onComplete?.();
            return;
        }

        const container = new PIXI.Container();
        container.x = x;
        container.y = y;
        container.alpha = 1;
        container.scale.set(1);
        container.rotation = 0;

        const text = new PIXI.Text(emoji, {
            fontSize: size * 1.2,
            fontFamily: '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif',
            align: 'center',
            dropShadow: true,
            dropShadowColor: '#000000',
            dropShadowAlpha: 0.28,
            dropShadowBlur: 6,
        });
        text.anchor.set(0.5);
        container.addChild(text);
        effectLayer.addChild(container);

        const modes = ['grow', 'rotate', 'blink'];
        const effect = {
            container,
            text,
            mode: modes[Math.floor(Math.random() * modes.length)],
            phase: 'static',
            timer: 0,
            staticDuration: 1.0,
            animationDuration: 0.7,
            onComplete,
        };
        emojiEffects.push(effect);
    }

    function queuePostEffectAction(action) {
        if (!action) return;
        if (pendingPostEffectAction) {
            const previousAction = pendingPostEffectAction;
            pendingPostEffectAction = () => {
                previousAction();
                action();
            };
        } else {
            pendingPostEffectAction = action;
        }
    }

    function runPendingPostEffectAction() {
        if (!pendingPostEffectAction) return;
        const action = pendingPostEffectAction;
        pendingPostEffectAction = null;
        action();
    }

    function updateEmojiEffects(deltaTime = 1 / 60) {
        for (let i = emojiEffects.length - 1; i >= 0; i--) {
            const effect = emojiEffects[i];
            effect.timer += deltaTime;

            if (effect.phase === 'static') {
                if (effect.timer >= effect.staticDuration) {
                    effect.phase = 'anim';
                    effect.timer = 0;
                }
                continue;
            }

            if (effect.phase === 'anim') {
                const progress = Math.min(1, effect.timer / effect.animationDuration);
                if (effect.mode === 'grow') {
                    const scale = 1 + Math.sin(progress * Math.PI * 2) * 0.08;
                    effect.container.scale.set(scale);
                } else if (effect.mode === 'rotate') {
                    effect.container.rotation = Math.sin(progress * Math.PI * 2) * 0.18;
                } else if (effect.mode === 'blink') {
                    const blink = (Math.floor(progress * 4) % 2 === 0) ? 1 : 0.2;
                    effect.container.alpha = blink;
                }

                if (effect.timer >= effect.animationDuration) {
                    effectLayer.removeChild(effect.container);
                    emojiEffects.splice(i, 1);
                    if (emojiEffects.length === 0) {
                        runPendingPostEffectAction();
                    }
                }
            }
        }
    }

    // ---- 奖励车辆列表 ----
    const VEHICLES = [
        // 无尾气奖励
        { type: 'emoji', emoji: '🚂', hasExhaust: false },
        { type: 'emoji', emoji: '🦈', hasExhaust: false },
        { type: 'emoji', emoji: '🦀', hasExhaust: false },
        { type: 'emoji', emoji: '🐠', hasExhaust: false },
        { type: 'emoji', emoji: '🐢', hasExhaust: false },
        { type: 'emoji', emoji: '🐡', hasExhaust: false },
        { type: 'emoji', emoji: '🛹', hasExhaust: false },

        // 有尾气奖励（默认朝向左边）
        { type: 'emoji', emoji: '🚓', hasExhaust: true },
        { type: 'emoji', emoji: '🚑', hasExhaust: true },
        { type: 'emoji', emoji: '🚒', hasExhaust: true },
        { type: 'emoji', emoji: '🏍️', hasExhaust: true },
        { type: 'emoji', emoji: '🚚', hasExhaust: true },
        { type: 'emoji', emoji: '🏎️', hasExhaust: true },
    ];

    // ---- 生成车辆 ----
    function spawnCreature(options = {}) {
        const {
            count = 1,
            hasExhaust = null,
            direction = null,
            baseY = null,
            spreadY = 0,
            startOffset = 0,
            cols: requestedCols = null,
        } = options;

        const chosenHasExhaust = hasExhaust !== null ? hasExhaust : (Math.random() < 0.5);
        const chosenDirection = direction || (chosenHasExhaust ? 'right' : 'left');
        const fromLeft = chosenDirection === 'left';
        const vehicles = VEHICLES.filter(v => !!v.hasExhaust === chosenHasExhaust);
        if (vehicles.length === 0) return;

        const chosenVehicle = vehicles[Math.floor(Math.random() * vehicles.length)];
        const cols = requestedCols !== null ? requestedCols : (count >= 10 ? 2 : Math.min(count, 5));
        const rows = Math.ceil(count / cols);
        const totalWidth = Math.min(W, H) * 0.8 + 120;
        const spacingX = cols > 1 ? totalWidth / (cols - 1) : 0;
        const minY = H * 0.30;
        const maxY = H * 0.70;
        const spacingY = rows > 1 ? (maxY - minY) / (rows - 1) : 0;

        for (let i = 0; i < count; i++) {
            const v = chosenVehicle;
            const size = Math.min(W, H) * (0.16 + Math.random() * 0.04);
            const col = i % cols;
            const row = Math.floor(i / cols);
            const x = fromLeft
                ? -size * 1.4 - 80 + startOffset + col * spacingX
                : W + size * 1.4 + 80 + startOffset - col * spacingX;
            const y = baseY !== null
                ? baseY + (row - (rows - 1) / 2) * (rows > 1 ? spreadY / ((rows - 1) / 2) : 0)
                : minY + row * spacingY + (Math.random() - 0.5) * 30;
            const baseSpeed = (0.8 + Math.random() * 0.4) * creatureSpeedMul;

            const sprite = drawEmojiPixi(0, 0, size, v.emoji);
            sprite.scale.x = fromLeft ? -1 : 1;
            sprite.x = x;
            sprite.y = y;
            creatureLayer.addChild(sprite);

            creatures.push({
                sprite: sprite,
                x: x,
                y: y,
                size: size,
                speed: Math.max(0.2, baseSpeed) * (fromLeft ? 1 : -1),
                waveOffset: Math.random() * Math.PI * 2,
                waveAmplitude: size * 0.02,
                fromLeft: fromLeft,
                alpha: 0,
                exhaustTimer: 0,
                hasExhaust: chosenHasExhaust,
            });
        }

        easterEggActive = true;
        creaturePaused = true;
        creatures.forEach(c => c.sprite.alpha = 0);
    }

    // ---- 更新车辆 ----
    function updateCreatures() {
        if (creatures.length === 0) return;
        for (let i = creatures.length - 1; i >= 0; i--) {
            const creatureObj = creatures[i];
            creatureObj.alpha = Math.min(1, creatureObj.alpha + 0.04);
            creatureObj.sprite.alpha = creatureObj.alpha * 0.95;
            creatureObj.x += creatureObj.speed;
            creatureObj.waveOffset += 0.03;
            creatureObj.y += Math.sin(creatureObj.waveOffset) * creatureObj.waveAmplitude * 0.04;
            creatureObj.sprite.x = creatureObj.x;
            creatureObj.sprite.y = creatureObj.y;
            creatureObj.exhaustTimer += 1;
            if (creatureObj.hasExhaust && creatureObj.exhaustTimer % 6 === 0) {
                const offsetX = creatureObj.fromLeft ? -creatureObj.size * 1.05 : creatureObj.size * 1.05;
                const offsetY = creatureObj.size * 0.40 + 10;
                const color = 0xffcc66;
                const count = 6;
                for (let j = 0; j < count; j++) {
                    const p = new PIXI.Graphics();
                    p.beginFill(color, 0.65 - Math.random() * 0.25);
                    const radius = 3 + Math.random() * 4;
                    p.drawCircle(0, 0, radius);
                    p.endFill();
                    p.x = creatureObj.x + offsetX + (Math.random() - 0.5) * 6;
                    p.y = creatureObj.y + offsetY + (Math.random() - 0.5) * 5;
                    particleLayer.addChild(p);
                    particles.push({
                        sprite: p,
                        x: p.x,
                        y: p.y,
                        vx: creatureObj.fromLeft ? -1.1 - Math.random() * 0.5 : -0.8 - Math.random() * 0.2,
                        vy: -0.4 + Math.random() * 0.6,
                        life: 1.0,
                        decay: 0.015 + Math.random() * 0.02,
                        gravity: 0.01,
                    });
                }
            }
            const margin = creatureObj.size * 1.8;
            if ((creatureObj.fromLeft && creatureObj.x > W + margin) ||
                (!creatureObj.fromLeft && creatureObj.x < -margin)) {
                creatureLayer.removeChild(creatureObj.sprite);
                creatures.splice(i, 1);
            }
        }

        if (creatures.length === 0) {
            easterEggActive = false;
            creaturePaused = false;
            if (gameRunning && !bubble && emojiEffects.length === 0) bubble = createBubble();
        }
    }

    // ---- 操作 ----
    function scheduleNextBubble(delay = 0) {
        setTimeout(() => {
            if (gameRunning && !creaturePaused && !bubble && emojiEffects.length === 0) {
                bubble = createBubble();
            }
        }, delay);
    }

    function onCorrect() {
        if (!bubble || bubble.bursting || !bubble.alive || bubble.matched) return;
        if (creaturePaused) return;
        const poppedBubble = bubble;
        poppedBubble.matched = true;
        poppedBubble.bursting = true;
        poppedBubble.alive = false;
        spawnParticles(poppedBubble.x, poppedBubble.y);
        bubbleLayer.removeChild(poppedBubble.sprite);
        bubble = null;
        score++;

        if (score === 13 || score === 23) {
            nextBubbleMode = 'mischief';
        }

        const milestone = Math.floor(score / triggerInterval);
        if (score === 30 && !easterEggActive) {
            lastMilestone = milestone;
        } else if (milestone > lastMilestone && score % triggerInterval === 0 && !easterEggActive) {
            lastMilestone = milestone;
        }

        let rewardAction = null;
        if (score === 30 && !easterEggActive) {
            rewardAction = () => {
                spawnCreature({
                    count: 10,
                    hasExhaust: Math.random() < 0.5,
                    direction: Math.random() < 0.5 ? 'left' : 'right',
                    baseY: H * 0.45,
                    spreadY: H * 0.32,
                    startOffset: 0,
                    cols: 2,
                });
            };
        } else if (milestone > lastMilestone && score % triggerInterval === 0 && !easterEggActive) {
            rewardAction = () => spawnCreature();
        }

        const charVal = poppedBubble.char;
        const hadEmojiEffect = !!WORD_CONFIG.emoji_dict?.[charVal];
        if (hadEmojiEffect) {
            queuePostEffectAction(() => {
                if (gameRunning && !creaturePaused && !bubble && emojiEffects.length === 0) {
                    bubble = createBubble();
                }
                if (rewardAction && gameRunning && !creaturePaused) {
                    rewardAction();
                }
            });
            spawnEmojiEffect(charVal, poppedBubble.x, poppedBubble.y, poppedBubble.radius);
        } else {
            if (rewardAction) {
                rewardAction();
            } else {
                scheduleNextBubble(0);
            }
        }
    }

    function onWrong() {
        if (!bubble || bubble.bursting || !bubble.alive || bubble.matched) return;
        if (creaturePaused) return;
    }

    // ---- 事件 ----
    app.view.addEventListener('click', () => {
        if (!gameRunning) {
            startGame();
            return;
        }
        onCorrect();
    });
    app.view.addEventListener('contextmenu', (e) => { e.preventDefault(); if (!gameRunning) return;
        onWrong(); });
    app.view.addEventListener('touchstart', (e) => {
        if (!gameRunning) return;
        e.preventDefault();
        const touch = e.touches[0];
        const rect = app.view.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        if (x < W / 2) onCorrect();
        else onWrong();
    }, { passive: false });
    document.addEventListener('keydown', (e) => {
        if (!gameRunning) return;
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') { e.preventDefault();
            onCorrect(); } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowRight') { e
                .preventDefault();
            onWrong(); }
    });

    // ---- 双击返回 ----
    let lastClickTime = 0;

    function goBackToMenu() {
        if (!gameRunning) return;
        gameRunning = false;
        overlay.style.display = 'flex';
        bubbleLayer.removeChildren();
        particleLayer.removeChildren();
        creatureLayer.removeChildren();
        effectLayer.removeChildren();
        particles = [];
        bubble = null;
        creatures.forEach(c => creatureLayer.removeChild(c.sprite));
        creatures = [];
        emojiEffects = [];
        pendingPostEffectAction = null;
        easterEggActive = false;
        creaturePaused = false;
        hint.textContent = '✨ 已返回，调整后重新开始';
        hint.style.opacity = '1';
        setTimeout(() => { hint.style.opacity = '0'; }, 1500);
    }
    document.addEventListener('dblclick', goBackToMenu);
    app.view.addEventListener('touchstart', function(e) {
        const now = Date.now();
        if (now - lastClickTime < 400) {
            e.preventDefault();
            goBackToMenu();
            lastClickTime = 0;
        } else {
            lastClickTime = now;
        }
    }, { passive: false });

    // ---- 重置 ----
    function resetGame() {
        particleLayer.removeChildren();
        creatureLayer.removeChildren();
        effectLayer.removeChildren();
        particles = [];
        pendingPostEffectAction = null;
        score = 0;
        lastMilestone = 0;
        lastChar = null;
        creatures.forEach(c => creatureLayer.removeChild(c.sprite));
        creatures = [];
        easterEggActive = false;
        creaturePaused = false;
        if (bubble) {
            bubbleLayer.removeChild(bubble.sprite);
            bubble = null;
        }
        bubble = createBubble();
    }

    // ---- 更新 ----
    function update(deltaTime = 1 / 60) {
        if (!gameRunning) return;
        const step = deltaTime * 60;
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * step;
            p.y += p.vy * step;
            p.vx *= p.friction || 0.98;
            p.vy += (p.gravity || 0.04) * step;
            p.life -= (p.decay || 0.02) * step;
            p.sprite.alpha = Math.max(0, p.life);
            p.sprite.x = p.x;
            p.sprite.y = p.y;
            if (p.life <= 0) {
                particleLayer.removeChild(p.sprite);
                particles.splice(i, 1);
            }
        }
        updateCreatures();
        updateEmojiEffects(deltaTime);
        if (creaturePaused) return;
        if (!bubble && gameRunning) {
            if (emojiEffects.length > 0) return;
            bubble = createBubble();
            return;
        }
        if (!bubble) return;
        if (bubble.alive && !bubble.bursting) {
            if (bubble.mode === 'mischief') {
                bubble.phaseTimer += deltaTime;
                if (bubble.phase === 'bounce') {
                    bubble.vx += (Math.random() * 2 - 1) * 0.6 * step;
                    bubble.vy += (Math.random() * 2 - 1) * 0.6 * step;
                    const speed = Math.sqrt(bubble.vx * bubble.vx + bubble.vy * bubble.vy);
                    const maxSpeed = 320;
                    if (speed > maxSpeed) {
                        bubble.vx *= maxSpeed / speed;
                        bubble.vy *= maxSpeed / speed;
                    }
                    bubble.x += bubble.vx * step;
                    bubble.y += bubble.vy * step;
                    if (bubble.x - bubble.radius < 0) {
                        bubble.x = bubble.radius;
                        bubble.vx = Math.abs(bubble.vx) * 0.96;
                    } else if (bubble.x + bubble.radius > W) {
                        bubble.x = W - bubble.radius;
                        bubble.vx = -Math.abs(bubble.vx) * 0.96;
                    }
                    if (bubble.y - bubble.radius < 0) {
                        bubble.y = bubble.radius;
                        bubble.vy = Math.abs(bubble.vy) * 0.96;
                    } else if (bubble.y + bubble.radius > H) {
                        bubble.y = H - bubble.radius;
                        bubble.vy = -Math.abs(bubble.vy) * 0.96;
                    }
                    if (bubble.phaseTimer >= bubble.bounceDuration) {
                        bubble.phase = 'spiral';
                        bubble.phaseTimer = 0;
                        bubble.spiralTimer = 0;
                        const dx = W / 2 - bubble.x;
                        const dy = H / 2 - bubble.y;
                        bubble.initialSpiralRadius = Math.sqrt(dx * dx + dy * dy);
                        bubble.spiralAngle = Math.atan2(dy, dx);
                        bubble.spiralThetaStart = bubble.spiralAngle;
                        const totalDelta = bubble.spiralOmega * bubble.spiralDuration * 60;
                        bubble.spiralDecay = Math.log(Math.max(bubble.initialSpiralRadius / 8, 1)) / totalDelta;
                    }
                } else if (bubble.phase === 'spiral') {
                    bubble.spiralTimer += deltaTime;
                    bubble.spiralAngle += bubble.spiralOmega * step;
                    const deltaTheta = bubble.spiralAngle - bubble.spiralThetaStart;
                    const r = bubble.initialSpiralRadius * Math.exp(-bubble.spiralDecay * deltaTheta);
                    bubble.x = W / 2 - r * Math.cos(bubble.spiralAngle);
                    bubble.y = H / 2 - r * Math.sin(bubble.spiralAngle);
                    if (bubble.spiralTimer >= bubble.spiralDuration || r < 18) {
                        bubble.mode = 'normal';
                        bubble.angle = 0;
                        bubble.wobbleAmplitude = 2.5 + Math.random() * 1.6;
                        bubble.wobbleSpeed = 0.01 + Math.random() * 0.02;
                        bubble.speed = Math.max(140, (240 + Math.random() * 80) * (bubbleSpeedMul / 6));
                    }
                }
                bubble.sprite.x = bubble.x;
                bubble.sprite.y = bubble.y;
                bubble.sprite.rotation = 0;
            } else {
                bubble.angle += bubble.wobbleSpeed * step;
                const offsetX = Math.sin(bubble.angle) * bubble.wobbleAmplitude;
                bubble.x += offsetX * 0.08 * step;
                bubble.y -= bubble.speed * deltaTime;
                bubble.sprite.x = bubble.x;
                bubble.sprite.y = bubble.y;
                bubble.sprite.rotation = Math.sin(bubble.angle) * 0.05;

                if (bubble.y < bubble.radius + 20) {
                    bubble.y = bubble.radius + 20;
                    bubble.speed = 0;
                    bubble.topTimer += deltaTime;
                    if (bubble.topTimer > 5.0) {
                        bubble.alive = false;
                        bubble.bursting = true;
                        for (let i = 0; i < 10; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 0.5 + Math.random() * 1.5;
                            const p = new PIXI.Graphics();
                            p.beginFill(0x96c8ff, 0.4);
                            p.drawCircle(0, 1.5 + Math.random() * 3);
                            p.endFill();
                            p.x = bubble.x + (Math.random() - 0.5) * 8;
                            p.y = bubble.y - 8 + (Math.random() - 0.5) * 8;
                            particleLayer.addChild(p);
                            particles.push({
                                sprite: p,
                                vx: Math.cos(angle) * speed,
                                vy: Math.sin(angle) * speed - 0.5,
                                life: 1.0,
                                decay: 0.03 + Math.random() * 0.03,
                                gravity: 0.015,
                            });
                        }
                        bubbleLayer.removeChild(bubble.sprite);
                        setTimeout(() => {
                            if (gameRunning && !creaturePaused && !bubble) {
                                bubble = createBubble();
                            }
                        }, 350);
                    }
                } else {
                    bubble.topTimer = 0;
                }
            }
        }
    }

    // ---- 渲染 UI ----
    function renderUI() {
        uiLayer.removeChildren();
        const scoreText = new PIXI.Text(`⭐ ${score}`, {
            fontSize: Math.min(W, H) * 0.04,
            fill: '#ffffff',
            fontFamily: '"Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif',
            fontWeight: '500',
            dropShadow: true,
            dropShadowColor: '#000000',
            dropShadowAlpha: 0.5,
            dropShadowBlur: 8,
        });
        scoreText.x = 18;
        scoreText.y = 18;
        scoreText.interactive = true;
        scoreText.buttonMode = true;
        scoreText.cursor = 'pointer';
        scoreText.hitArea = new PIXI.Rectangle(0, 0, scoreText.width, scoreText.height);
        scoreText.on('pointerdown', () => {
            const value = prompt('请输入答对次数', String(score));
            const next = Number(value);
            if (Number.isInteger(next) && next >= 0) {
                score = next;
            }
        });
        uiLayer.addChild(scoreText);

        const nextMilestone = (Math.floor(score / triggerInterval) + 1) * triggerInterval;
        const remain = nextMilestone - score;
        if (remain > 0 && remain <= triggerInterval && !creaturePaused && !easterEggActive) {
            const progressText = new PIXI.Text(`🏁 再答对 ${remain} 次`, {
                fontSize: Math.min(W, H) * 0.016,
                fill: 'rgba(255,255,255,0.25)',
                fontFamily: '"Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif',
            });
            progressText.x = 18;
            progressText.y = 18 + Math.min(W, H) * 0.045;
            uiLayer.addChild(progressText);
        }
    }

    // ---- 游戏循环 ----
    let lastFrameTime = performance.now();

    function gameLoop(now = performance.now()) {
        const deltaTime = Math.min(0.033, (now - lastFrameTime) / 1000 || 1 / 60);
        lastFrameTime = now;
        update(deltaTime);
        renderUI();
        requestAnimationFrame(gameLoop);
    }

    // ---- 启动 ----
    function startGame() {
        const checked = activeChars.length;
        if (checked === 0) {
            hint.textContent = '⚠️ 请至少选一个！';
            hint.style.opacity = '1';
            setTimeout(() => { hint.style.opacity = '0'; }, 1200);
            return;
        }
        triggerInterval = parseInt(intervalSelect.value);
        bubbleSpeedMul = parseInt(bubbleSpeedSlider.value, 10);
        creatureSpeedMul = parseInt(creatureSpeedSlider.value, 10);
        if (gameRunning) return;
        overlay.style.display = 'none';
        gameRunning = true;
        resetGame();
    }

    startBtn.addEventListener('click', startGame);
    testRewardBtn.addEventListener('click', function() {
        if (!gameRunning) {
            gameRunning = true;
            overlay.style.display = 'none';
            resetGame();
        }
        if (creatures.length === 0 && !easterEggActive) {
            if (emojiEffects.length > 0) return;
            spawnCreature();
        }
    });

    window.onload = async function() {
        initializeWords();
        renderWords();
        drawBackground();
        gameLoop();
    };

    window.addEventListener('resize', () => {
        W = window.innerWidth;
        H = window.innerHeight;
        drawBackground();
    });
</script>
</body>
</html>
